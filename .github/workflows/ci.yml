name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q src tools tests
      - name: Run Java-free unit and baseline tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Verify metric-contract/1
        env:
          PYTHONPATH: src
        run: python tools/metric_contract.py

  native-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install release, native stack, and audit tools
        run: >-
          python -m pip install
          '.[all]'
          'build>=1.2,<2'
          'mypy>=1.10,<2'
          'ruff>=0.5,<1'
          'twine>=5,<7'
      - name: Run complete native suite
        env:
          PYHERMIT_BACKEND: python
          PYELK_PURE_PYTHON: "1"
        run: python -m unittest discover -s tests -v
      - name: Verify both native fixture paths
        env:
          PYHERMIT_BACKEND: python
          PYELK_PURE_PYTHON: "1"
        run: |
          python tools/native_fixture_compare.py --reasoner hermit --timeout none
          python tools/native_fixture_compare.py --reasoner elk --timeout 60
      - name: Static quality gates
        run: |
          ruff check src tools tests benchmarks
          mypy --strict src
      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Smoke-test the wheel without optional dependencies
        run: |
          python -m venv /tmp/oaei-wheel-smoke
          /tmp/oaei-wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          /tmp/oaei-wheel-smoke/bin/python -c \
            'import oaei_bioml_eval; assert oaei_bioml_eval.__version__ == "0.2.0"'
          /tmp/oaei-wheel-smoke/bin/python -m oaei_bioml_eval.coherence.cli --help
