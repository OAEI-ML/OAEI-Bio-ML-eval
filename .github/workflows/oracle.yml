name: Manual ROBOT oracle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  robot-1-9-10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "11"
      - name: Fetch the pinned development-only oracle
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/ontodev/robot/releases/download/v1.9.10/robot.jar \
            --output /tmp/robot-1.9.10.jar
          echo "16a73c074f3df359a7338a84b4e0788785fe06117f931bb9796e9619ea776105  /tmp/robot-1.9.10.jar" \
            | sha256sum --check
      - name: Verify two-pass oracle reproduction
        env:
          PYTHONPATH: src
        run: >-
          python tools/robot_oracle.py
          --robot-jar /tmp/robot-1.9.10.jar
          --java "$JAVA_HOME/bin/java"
      - name: Confirm no generated drift
        run: git diff --exit-code
