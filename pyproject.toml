[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "oaei-bioml-eval"
version = "0.2.0"
description = "Common evaluation/scoring logic for the OAEI Bio-ML tracks (public + private)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "OAEI-ML contributors" }]
keywords = ["OAEI", "ontology-matching", "evaluation", "OWL", "reasoning"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
# Kept deliberately light so participants can self-score with a small install.
# The Track 1 and Track 2 TSV metrics are dependency-free; RDF input and native
# reasoners remain explicit optional installations.
dependencies = []

[project.optional-dependencies]
# Track 1 global submissions may arrive as OAEI Alignment RDF; rdflib parses them.
# (The metric core + the alignment-TSV path stay dependency-free.)
rdf = ["rdflib>=7.0,<8"]
reasoner = [
  "pyowl-core>=0.1,<0.2",
  "pyHermiT>=0.1,<0.2",
  "pyelk-reasoner>=0.1,<0.2",
]
all = [
  "rdflib>=7.0,<8",
  "pyowl-core>=0.1,<0.2",
  "pyHermiT>=0.1,<0.2",
  "pyelk-reasoner>=0.1,<0.2",
]

[project.urls]
Homepage = "https://github.com/OAEI-ML/OAEI-Bio-ML-eval"
Documentation = "https://github.com/OAEI-ML/OAEI-Bio-ML-eval/tree/main/docs"
Repository = "https://github.com/OAEI-ML/OAEI-Bio-ML-eval"
Issues = "https://github.com/OAEI-ML/OAEI-Bio-ML-eval/issues"
Specifications = "https://github.com/OAEI-ML/OAEI-Bio-ML-eval/tree/main/specs"

[project.scripts]
# self-score a Track 2 typed submission from the shell (see typed/cli.py)
oaei-bioml-typed-score = "oaei_bioml_eval.typed.cli:main"
# self-score a Track 1 equivalence submission (see equivalence/cli.py)
oaei-bioml-equivalence-score = "oaei_bioml_eval.equivalence.cli:main"
# organiser-computed Track 1 alignment coherence (see coherence/cli.py)
oaei-bioml-coherence-score = "oaei_bioml_eval.coherence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oaei_bioml_eval"]

# Finder/IDE conflict copies such as ``module 2.py`` are not importable Python
# modules and must never leak into a wheel or source distribution.  Keep this
# artifact rule independent of local ignore state so release builds remain clean.
[tool.hatch.build]
exclude = ["**/* 2.*"]

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/SBOM.spdx.json",
  "/docs",
  "/pyproject.toml",
  "/release",
  "/reports",
  "/specs",
  "/src",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["**/* 2.*"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
exclude = "(^|/).* 2\\.[^/]+$"
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["rdflib", "rdflib.*"]
ignore_missing_imports = true
